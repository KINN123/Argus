name: aisbench-acc
version: 0.1.4
display_name: AISBench 精度测试
description: 使用 GSM8K 做精度评测，保存逐题请求、回答和评分。分数低可成功，漏题或评分不完整会失败。
role: test
on_failure: continue
entry: /tester/run.sh
image: ghcr.io/ucm-system/testplane-tester-aisbench-acc:0.1.4
resources:
  cpu: "4"
  memory: "8Gi"
  gpu: {resource: nvidia.com/gpu, count: 0}
concurrency:
  endpoint_exclusive: false
# 部署前创建 PVC，或在发布前按环境修改 source；路径参数不会自动上传文件。
mounts:
  - {name: datasets, mount_path: /data, read_only: true, source: testplane-datasets}
  - {name: models, mount_path: /models, read_only: true, source: testplane-models}
placeholder: "--dataset=/data/gsm8k --dataset_config=gsm8k_4shot_cot --max_samples=100 --concurrency=4 --replay_rounds=2"
parameters:
  url:
    type: string
    required: true
    description: "OpenAI 兼容服务 base URL，由平台注入；本地调用时必填。"
  model_name:
    type: string
    required: true
    description: "服务端模型名，由平台注入；不会自动选择模型。"
  model_path:
    type: string
    required: true
    description: "容器内 tokenizer 目录绝对路径，由平台注入；模型卷需提前挂载。"
  concurrency:
    type: integer
    required: false
    default: "1"
    description: "同时请求数上限，1..100000。"
  request_rate:
    type: number
    required: false
    default: "0"
    description: "每秒请求数，0..64000；0 不额外限速。"
  seed:
    type: integer
    required: false
    default: "1"
    description: "0..2147483647；固定本地数据并请求服务使用此 seed，服务是否生效需验证。"
  dataset:
    type: string
    required: true
    description: "容器内数据路径。4shot 需要含 train.jsonl/test.jsonl 的目录；0shot 需要 JSONL 文件。"
  dataset_config:
    type: string
    required: false
    default: "gsm8k_4shot_cot"
    description: "gsm8k_4shot_cot 或 gsm8k_jsonl_0shot；每行必须有 question 和数字 answer。"
  max_samples:
    type: integer
    required: false
    default: "0"
    description: "0 表示全部，否则取原顺序前 N 条，条数不足报错。"
  output_len:
    type: integer
    required: false
    default: "1024"
    description: "每题最多输出 token 数，至少 1；允许 EOS 正常结束。"
  temperature:
    type: number
    required: false
    default: "0"
    description: "0..2，回答随机性。"
  top_p:
    type: number
    required: false
    default: "1"
    description: "大于 0 且不超过 1。"
  thinking:
    type: string
    required: false
    default: "default"
    description: "default/on/off；on/off 需要本地 chat_template 支持，服务行为需联调确认。"
  replay_rounds:
    type: integer
    required: false
    default: "1"
    description: "1 或 2；第二轮真正重发请求，结果单独保存。"
env:
  ENDPOINT_API_KEY:
    required: false
    secret: true
    description: 模型服务的 Bearer token，仅通过环境变量传入。
