name: aisbench-perf
version: 0.1.2
display_name: AISBench 性能与 prefix 命中率
description: 固定负载的性能测试，按 prefix 工具方法先预热再测量。采集稳定实例的缓存计数，区分 HBM、UCM 与 external 的分母。
role: test
on_failure: continue
entry: /tester/run.sh
image: ghcr.io/ucm-system/testplane-tester-aisbench-perf:0.1.2
resources:
  cpu: "4"
  memory: "8Gi"
  gpu: {resource: nvidia.com/gpu, count: 0}
concurrency:
  endpoint_exclusive: true
# 部署前创建 PVC，或在发布前按环境修改 source；路径参数不会自动上传文件。
mounts:
  - {name: datasets, mount_path: /data, read_only: true, source: testplane-datasets}
  - {name: models, mount_path: /models, read_only: true, source: testplane-models}
placeholder: "--input_len=2048 --output_len=128 --data_num=64 --concurrency=8 --repeat_rate=50% --metrics_endpoint=http://prefill-0:8000/metrics"
parameters:
  url:
    type: string
    required: true
    description: "OpenAI 兼容服务 base URL，由平台注入；本地调用时必填。"
  model_name:
    type: string
    required: true
    description: "服务端模型名，由平台注入；不会自动选择模型。"
  model_path:
    type: string
    required: true
    description: "容器内 tokenizer 目录绝对路径，由平台注入；模型卷需提前挂载。"
  concurrency:
    type: integer
    required: false
    default: "1"
    description: "同时请求数上限，1..100000。"
  request_rate:
    type: number
    required: false
    default: "0"
    description: "每秒请求数，0..64000；0 不额外限速。"
  seed:
    type: integer
    required: false
    default: "1"
    description: "0..2147483647；固定本地数据并请求服务使用此 seed，服务是否生效需验证。"
  dataset_type:
    type: string
    required: false
    default: "prefix_cache"
    description: "normal 或 prefix_cache；第一版生成固定长度文本。"
  dataset:
    type: string
    required: false
    description: "可选，已有 JSONL 文件绝对路径，每行非空 question；与显式 input_len/prefix_num/repeat_rate 互斥。"
  warmup_dataset:
    type: string
    required: false
    description: "已有前缀数据开启预热时必填，必须与正式数据有对应的 token 前缀。"
  input_len:
    type: integer
    required: false
    default: "2048"
    description: "生成文本的 token 数，至少 4，不含聊天模板。"
  output_len:
    type: integer
    required: false
    default: "128"
    description: "输出 token 上限，至少 1；请求 ignore_eos=true，同时记录实际长度。"
  data_num:
    type: integer
    required: false
    description: "生成数据默认 64；已有文件默认全部；显式值至少 1，取前 N 条。"
  test_type:
    type: string
    required: false
    default: "stream"
    description: "stream 或 text；非流式逐 token 时延为 null。"
  repeat:
    type: integer
    required: false
    default: "1"
    description: "至少 1；同一批数据逐轮测试，保留每轮结果，不清缓存。"
  prefix_num:
    type: integer
    required: false
    default: "1"
    description: "生成前缀种数，1..min(data_num,100000)；normal 或已有 dataset 不能显式设置。"
  repeat_rate:
    type: string
    required: false
    default: "0.5"
    description: "0..1 或 0%..100%；目标前缀占比，不是实际命中率。"
  prefix_test:
    type: boolean
    required: false
    description: "true/false；前缀模式默认 true，normal 默认 false。"
  dp:
    type: integer
    required: false
    default: "1"
    description: "1..100000；生成数据的预热副本数参考 DP，已有预热文件按行数发送，dp 只影响并发；不保证路由覆盖全部实例。"
  metrics_endpoint:
    type: string
    required: true
    description: "完整 http(s)://实例/metrics 地址，可重复给多台。PD 时用 Prefill 实例；不要用随机转发网关。"
  metrics_profile:
    type: string
    required: false
    default: "ucm_connector"
    description: "ucm_connector 或 vllm_prefix，两者分母不同。"
  metrics_policy:
    type: string
    required: false
    default: "required"
    description: "required 采集失败任务失败；best_effort 可保留完整性能，缺失命中率写 null。"
  metrics_timeout_seconds:
    type: number
    required: false
    default: "5"
    description: "单次采集超时，大于 0、不超过 30 秒，最多重试一次。"
  settle_seconds:
    type: number
    required: false
    default: "5"
    description: "预热和测量后等待 0..60 秒，再读取计数，不计入请求耗时。"
env:
  ENDPOINT_API_KEY:
    required: false
    secret: true
    description: 模型服务的 Bearer token，仅通过环境变量传入。
  METRICS_API_KEY:
    required: false
    secret: true
    description: 指标接口专用 Bearer token，不与模型密钥混用。
